<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0d0d0d" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#249516" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#14530c" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#249516" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#249516" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Glow center -->
  <circle cx="400" cy="300" r="350" fill="url(#glow)" />
  
  <!-- Tech lines and geometric visualizers -->
  <g opacity="0.3">
    <circle cx="400" cy="300" r="200" fill="none" stroke="#249516" stroke-width="1" stroke-dasharray="5, 10" />
    <circle cx="400" cy="300" r="250" fill="none" stroke="#249516" stroke-width="2" opacity="0.5" />
    <line x1="100" y1="300" x2="700" y2="300" stroke="#249516" stroke-width="0.5" />
    <line x1="400" y1="100" x2="400" y2="500" stroke="#249516" stroke-width="0.5" />
    <rect x="250" y="150" width="300" height="300" fill="none" stroke="#249516" stroke-width="1" opacity="0.2" />
  </g>
  
  <!-- Header tag -->
  <rect x="50" y="50" width="120" height="24" rx="12" fill="#249516" fill-opacity="0.1" stroke="#249516" stroke-width="1" />
  <text x="110" y="66" fill="#249516" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5" text-anchor="middle" text-transform="uppercase">signage</text>
  
  <!-- Brand elements -->
  <text x="750" y="70" fill="#ffffff" opacity="0.1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="end">FALSAFI.</text>
  
  <!-- Centered Title -->
  <text x="400" y="290" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="2" text-anchor="middle" text-transform="uppercase">Interior & Exterior</text>
  <text x="400" y="330" fill="#249516" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" letter-spacing="4" text-anchor="middle" text-transform="uppercase">CREATIVE PRODUCTION</text>
  
  <!-- Bottom technical detail -->
  <text x="50" y="550" fill="#666666" font-family="monospace" font-size="10">SYS_REF: INTERIOR_&_EXTERIOR</text>
  <text x="750" y="550" fill="#666666" font-family="monospace" font-size="10" text-anchor="end">LOC: AJMAN_DUBAI_UAE</text>
</svg>